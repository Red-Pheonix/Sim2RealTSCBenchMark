# Budget: 100 episodes x (1 sim eval rollout + 1 real posterior-conditioning rollout) + 91 sim
# train episodes (10-episode posterior warm-up) = ~291 episodes + 100 real rows, per the policy in
# notes/experiments/README.md. real_eval_interval stays 0 ON PURPOSE: the 100 REAL_TRAIN rollouts
# already ARE the real curve (each is a full eval of the current checkpoint), so adding a REAL_TEST
# curve would spend 200 real rows, double every other method. Analysis scores DA from its
# REAL_TRAIN rows, same top-K rule as gat/ugat; the single terminal REAL_TEST is the LAST
# checkpoint (this trainer has no keep-best), not a promoted best.
trainer:
  episodes: 100
  real_eval_interval: 0

sim2real:
  method: "domain_adaptation"
  sim_rollouts: 1
  training_iterations: 1
  domain_randomization:
    enabled: True
    seed: 0
    output_dir: output_data/sim2real_transitions/domain_adaptation
    parameters:
      headwayTime:
        distribution: normal
        normal_config:
          mean: 2.10
          std: 1.77
        clip_min: 0.5
        clip_max: 5.0
      minGap:
        distribution: normal
        normal_config:
          mean: 2.9
          std: 0.36
        clip_min: 1.5
        clip_max: 4.0
      usualPosAcc:
        distribution: normal
        normal_config:
          mean: 2.63
          std: 1.36
        clip_min: 0.1
        clip_max: 7.0
      usualNegAcc:
        distribution: normal
        normal_config:
          mean: 3.70
          std: 1.56
        clip_min: 1.0   # was 0.1; <~0.4 makes weak-braking cars overshoot cologne3's short roads -> CityFlow router.cpp assert (SIGABRT); 1.0 verified 0/440 in the DR sweep
        clip_max: 7.0
      length:
        distribution: normal
        normal_config:
          mean: 5.0
          std: 0.64
        clip_min: 4.7
        clip_max: 5.0
  inference:
    density_estimator: "nsf"
    min_posterior_samples: 10
    embedding:
      enabled: True
      type: "fc"
      output_dim: 20
      num_layers: 2
      num_hiddens: 50
