# UGAT + DEPLOYMENT SHIELD. Uncertainty-gated GAT-trained policy deployed MASKED (legal
# -action set at real eval) -> 0 violations by construction; measures whether ugat training
# helps travel time over naive+shield. Same trainer as ugat.yml; real-side mode = shield.
trainer:
  episodes: 40
  real_eval_interval: 1
  eval_sim: false

sim2real:
  method: ugat
  gat_warmup: 5
  gat_uncertainty: true
  gat_forward_action: proposed
  real_phase_transition_mode: shield     # <-- mask the policy at deployment (0 violations)
