# PRLight (Han et al., KDD 2023): one-shot neighbor-aware prediction. Predicts
# the state m decisions ahead in a single forward pass (no rollout) from ego
# obs/phase/in-flight queue + neighbor obs/phases, then the base agent acts on
# the predicted state. Same protocol as delayed_q otherwise.
trainer:
  episodes: 300
  real_eval_interval: 3  # run real eval every episode during training
  eval_sim: false        # only real-delay transfer matters

sim2real:
  method: prlight
  sim_action_delay: 20      # env delay during sim training; match real action_delay
  pred_learning_rate: 0.001 # paper: Adam lr 1e-3
  pred_train_iters: 1
  pred_buffer_cap: 1000     # paper: prediction buffer length 1000
  probing_radius: 600       # neighbor radius in roadnet units (JL-GAT style)
  include_neighbor_actions: false  # paper ignores neighbor control within horizon
