task:
  description: use RL methods to optimize traffic signal control problems
  task_name: sim2real_actions

world:
# necessary and distinctive parameters for simulators
  interval: 1.0
  seed: 0
  dir: data/

  saveReplay: False
  report_log_mode: normal # cbengine
  report_log_rate: 10

  no_warning: True
  gui:  False

  rlTrafficLight: True

trainer:
  thread: 16
  ngpu: -1
  learning_start: 5000
  buffer_size: 5000
  steps: 3600
  test_steps: 3600
  yellow_length: 5
  action_interval: 10
  episodes: 1
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: False

sim2real:
  load_pretrained: True
  # Phase-transition (action-validity) masking. OFF by default; opt in per side.
  # Value:
  #   false / null / unset -> no masking on that side (no masks applied)
  #   "<variant>"          -> per-network variant table:
  #                           raw_data/<network>/phase_transitions/<variant>.json
  #                           (e.g. pt_cyclic -> raw_data/tempe/phase_transitions/pt_cyclic.json)
  #   "<path>"             -> exact path (has a '/' or ends in .json/.csv), relative to dir
  # A bare variant name keeps a setting file correct across a network sweep (picked
  # per network). A requested-but-missing file is a hard error (phase-transition runs
  # only exist for networks that ship a table). The table is in canonical NEMA order
  # and reordered to the agent's action order via the net's tlLogic at load time. sim
  # side usually lives in the method yml; real side in settings/*.yml.
  # sim_phase_transition: pt_cyclic
  # real_phase_transition: pt_cyclic

model:
  name: "non-rl"
  train_model: True
  test_model: False
  load_model: False
  graphic: False
  vehicle_max: 1
  learning_rate: 0.001
  batch_size: 64
  gamma: 0.95
  epsilon: 0.5
  epsilon_decay: 0.99
  epsilon_min: 0.05
  grad_clip: 5.0

  one_hot: False
  phase: False

logger:
  root_dir: "data/output_data/"
  log_dir: "logger/"
  replay_dir: "replay/"
  model_dir: "model/"
  data_dir: "dataset/"
  save_model: True
  save_rate: 1
  attention: False
