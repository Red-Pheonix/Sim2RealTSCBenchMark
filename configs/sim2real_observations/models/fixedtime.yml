# Non-RL baseline. Fixed-time cycles on a timer and never reads a detector, so it is
# structurally invariant to every observation setting -- its REAL_TEST number is the
# no-gap number by construction. That invariance is the point of running it: it is the
# reference line the observation-sensitive controllers are measured against.
# Eval-only: run with `--obs_model direct_transfer` (0 episodes, single REAL_TEST row).
model:
  name: fixedtime
  t_fixed: 30

trainer:
  episodes: 0
  learning_start: 0
  buffer_size: 0
  update_model_rate: 0
  update_target_rate: 0
