# Non-RL baseline. Max-pressure DOES read detectors, so the observation settings bite:
# it decides on `observed_lane_count()`, which routes the in+out lane counts through
# the same LaneVehicleGenerator pipeline (noise / dropout / detection zone) the RL
# agents' observations go through.
# Eval-only: run with `--obs_model direct_transfer` (0 episodes, single REAL_TEST row).
model:
  name: maxpressure
  t_min: 10

trainer:
  episodes: 0
  learning_start: 0
  buffer_size: 0
  update_model_rate: 0
  update_target_rate: 0
