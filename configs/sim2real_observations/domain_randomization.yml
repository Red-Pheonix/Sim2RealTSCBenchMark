trainer:
  episodes: 300
  real_eval_interval: 3  # 300 eps / eval every 3rd -> 100 REAL_TEST rows

sim2real:
  method: domain_randomization
  load_pretrained: True
  domain_randomization:
    seed: 0
    parameters:
      detection_zone_distance:
        path: ["detection_zone", "distance_m"]
        distribution: uniform
        uniform_config:
          low: 1
          high: 100
      noise_std:
        path: ["noise", "gaussian_config", "std"]
        distribution: uniform
        uniform_config:
          low: 1.5
          high: 5.0
      lane_failure_probability:
        path: ["disable_sensor", "lane_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.1
          high: 0.3
      intersection_failure_probability:
        path: ["disable_sensor", "intersection_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.0
          high: 0.0
