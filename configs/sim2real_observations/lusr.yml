trainer:
  episodes: 200
  real_eval_interval: 1

sim2real:
  method: latent_observation
  latent_obs_method: lusr
  load_pretrained: True
  lusr:
    # If True, retrain encoders even when pretrained/lusr/{network}/ has cached weights.
    force_retrain: False

    # Per-intersection VAE shape.
    content_dim: 16
    class_dim: 16
    hidden: 64

    # Stage 1: one rollout per sampled DR config, all dumped into the VAE dataset.
    pretrain_episodes: 100

    # Stage 1 VAE training (per-intersection).
    # Tuned via random search (60 trials, tempe_1x1, setting4).
    epochs: 300
    batch_size: 64
    beta: 7.9
    bloss_coef: 0.95
    lr: 0.00011

  # Stage 1 reuses the existing observation DR distribution to sample domains.
  # Same parameter schema as configs/sim2real_observations/domain_randomization.yml.
  domain_randomization:
    seed: 0
    parameters:
      detection_zone_distance:
        path: ["detection_zone", "distance_m"]
        distribution: uniform
        uniform_config:
          low: 1
          high: 100
      noise_std:
        path: ["noise", "gaussian_config", "std"]
        distribution: uniform
        uniform_config:
          low: 1.5
          high: 5.0
      lane_failure_probability:
        path: ["disable_sensor", "lane_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.1
          high: 0.3
      intersection_failure_probability:
        path: ["disable_sensor", "intersection_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.0
          high: 0.0
