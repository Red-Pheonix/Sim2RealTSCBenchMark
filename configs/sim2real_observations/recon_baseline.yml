trainer:
  episodes: 200
  real_eval_interval: 1

sim2real:
  method: latent_observation
  latent_obs_method: recon_baseline
  load_pretrained: True
  recon_baseline:
    # If True, retrain even when pretrained/recon_baseline/{network}/ has cached weights.
    force_retrain: False

    # Bottleneck autoencoder shape. NOTE: unlike the latent methods, the policy
    # consumes the DECODER OUTPUT (the reconstructed observation, obs_dim), not
    # the bottleneck code -- latent_dim here is the compression/denoising knob.
    latent_dim: 8
    hidden: 128

    # Stage 1: one rollout per sampled DR config.
    pretrain_episodes: 100

    # Stage 1 autoencoder training (per-intersection). Plain MSE reconstruction;
    # no KL/beta -- that is what makes this the reconstruction baseline rather
    # than VAE-Embedding.
    epochs: 300
    batch_size: 64
    lr: 0.0001

  # Multi-domain stage-1 collection matches the shared-dataset practice used by
  # every other baseline; same param schema as configs/sim2real_observations/lusr.yml.
  domain_randomization:
    seed: 0
    parameters:
      detection_zone_distance:
        path: ["detection_zone", "distance_m"]
        distribution: uniform
        uniform_config:
          low: 1
          high: 100
      noise_std:
        path: ["noise", "gaussian_config", "std"]
        distribution: uniform
        uniform_config:
          low: 1.5
          high: 5.0
      lane_failure_probability:
        path: ["disable_sensor", "lane_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.1
          high: 0.3
      intersection_failure_probability:
        path: ["disable_sensor", "intersection_level", "probability"]
        distribution: uniform
        uniform_config:
          low: 0.0
          high: 0.0
