sim2real:
  # Physical safety via SURROGATE-safety conflicts (sumo SSM device, TTC below
  # SSM_TTC_THRESHOLD = 1.5s, the FHWA SSAM standard; see world_sumo.py),
  # attributed per intersection -- standard practice: sumo traffic is collision-free
  # by construction (junction conflicts resolve as emergency stops, not crashes), so
  # actual `collisions` carry ~no signal (kept in the layout, weight 0, still
  # measured/logged). Distinct from the `safety` (controller-rule violation)
  # component used by the phase-transition / shield special case. Sumo-only:
  # cityflow has no conflict measurement, so a sim-trained policy is blind to this
  # term and can only reach it through correlated proxies (queue).
  reward_components: [ssm_conflicts, collisions]
  true_reward:
    queue: 0.5
    ssm_conflicts: 2.0
  sim_episodes: 300
  real_episodes: 100
