task:
  description: use RL methods to optimize traffic signal control problems
  task_name: sim2real_rewards

world:
# necessary and distinctive parameters for simulators
  interval: 1.0
  seed: 0
  dir: data/

  saveReplay: False
  report_log_mode: normal # cbengine
  report_log_rate: 10

  no_warning: True
  gui:  False

  rlTrafficLight: True

trainer:
  thread: 16
  ngpu: -1
  learning_start: 5000
  buffer_size: 5000
  steps: 3600
  test_steps: 3600
  yellow_length: 5
  action_interval: 10
  episodes: 100
  update_model_rate: 1
  update_target_rate: 10
  # Real transfer-curve eval during sim training (naive family; the method trainers
  # self-log their own REAL_TRAIN rows). These are SCORING evals, excluded from the
  # real budget (train_test / test pass count_budget=False).
  test_when_train: True
  real_eval_interval: 3  # 300 eps / eval every 3rd -> 100 REAL_TEST rows

sim2real:
  load_pretrained: True
  # Per-component normalizers for the reward feature bank. The bank emits RAW costs;
  # the reward transforms divide each φ_i by these so -(w·φ) is scale-stable for the
  # Q-net and weights express RELATIVE importance. Settings may override per network.
  # (sumo-only / fairness norms are rough -- tune as needed.)
  component_norm:
    queue: 10.0
    delay: 1.0
    waiting: 100.0
    pressure: 10.0
    switches: 1.0
    fairness: 50.0      # max-min spread of CUMULATIVE served throughput (grows over episode)
    emission: 10.0
    fuel: 1.0
    emergency_stops: 1.0
    collisions: 1.0
    safety: 1.0

model:
  name: "non-rl"
  train_model: True
  test_model: True   # final benchmark scoring eval for every method (scoring, not budget)
  load_model: False
  graphic: False
  vehicle_max: 1
  learning_rate: 0.001
  batch_size: 64
  gamma: 0.95
  epsilon: 0.5
  epsilon_decay: 0.99
  epsilon_min: 0.05
  grad_clip: 5.0

  one_hot: False
  phase: False

logger:
  root_dir: "data/output_data/"
  log_dir: "logger/"
  replay_dir: "replay/"
  model_dir: "model/"
  data_dir: "dataset/"
  save_model: True
  save_rate: 1
  attention: False
